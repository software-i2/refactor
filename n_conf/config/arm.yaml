# Lengths are metres, angles are degrees, and times are seconds.

world:
  floor_z_m: -1.0e-6
  obstacle_field: "/mnt/d/beex/arm_ws/data/field.bin"

camera:
  at_m: [0.0, 0.1, 0.0]
  rpy_deg: [180.0, -90.0, 0.0]

arm:
  base_to_e_z: 0.0140       # base -> axis_e
  e_to_d_x: -0.02           # axis_e -> axis_d
  e_to_d_z: 0.0330
  d_to_c_x: -0.04           # axis_d -> axis_c, the upper arm
  d_to_c_z: -0.1453
  d_to_c_yaw_deg: 180.0     # must be 0 or 180; 180 reverses the elbow
  c_to_b_x: 0.02            # axis_c -> axis_b, the forearm
  c_to_b_z: 0.0330
  b_to_mount: 0.09975       # pivot -> tool mount
  mount_to_throat: 0.0400   # mount -> throat
  mount_to_tip: 0.0969      # mount -> jaw tips

  hinge_offset_deg: -60.0

  limit_lo_deg: {base: -2.403, shoulder: 0.0, elbow: 0.0, wrist: -184.5}
  limit_hi_deg: {base: 349.5, shoulder: 200.0, elbow: 184.5, wrist: 0.0}

  zero_offset_deg: {base: 2.403, shoulder: 0.0, elbow: 0.0, wrist: 0.0}
  direction_sign: {base: 1.0, shoulder: 1.0, elbow: 1.0, wrist: -1.0}

  weight: {base: 10.0, shoulder: 1.0, elbow: 1.0, wrist: 1.0}

jaws:
  palm_radius_m: 0.020
  palm_length_m: 0.00975

  hinge_xyz: [0.0, 0.0155, 0.0069]
  blade_size: [0.012, 0.030, 0.090]     # hinge, closing, approach
  blade_origin: [0.0, -0.008, 0.045]
  blade_profile: [-0.0050, 0.0000, -0.0252,  0.0051, 0.0057,
                   0.0000, 0.0050, -0.0252,  0.0058, 0.0057,
                   0.0050, 0.0100, -0.0202,  0.0063, 0.0057,
                   0.0100, 0.0150, -0.0165,  0.0066, 0.0057,
                   0.0150, 0.0200, -0.0153,  0.0067, 0.0049,
                   0.0200, 0.0250, -0.0144,  0.0067, 0.0049,
                   0.0250, 0.0300, -0.0138,  0.0065, 0.0049,
                   0.0300, 0.0350, -0.0137,  0.0060, 0.0049,
                   0.0350, 0.0400, -0.0139,  0.0052, 0.0049,
                   0.0400, 0.0450, -0.0145,  0.0043, 0.0049,
                   0.0450, 0.0500, -0.0156,  0.0030, 0.0049,
                   0.0500, 0.0550, -0.0168,  0.0015, 0.0049,
                   0.0550, 0.0600, -0.0184, -0.0003, 0.0049,
                   0.0600, 0.0650, -0.0202, -0.0024, 0.0049,
                   0.0650, 0.0700, -0.0211, -0.0048, 0.0049,
                   0.0700, 0.0750, -0.0211, -0.0076, 0.0049,
                   0.0750, 0.0800, -0.0211, -0.0107, 0.0049,
                   0.0800, 0.0852, -0.0211, -0.0143, 0.0049]
  open_mm: 8.0

  grip_margin_m: 0.020

driver:
  port: "/dev/ttyUSB0"     
  baud: 115200
  rate_hz: 10.0

  climate_period_s: 15.0    # one joint's climate per round-robin period
  log_period_s: 20.0        # console cadence; mode changes always print
  jog_timeout_s: 0.5        # a jog not re-sent within this is zeroed

  reply_timeout_s: 0.05     # wait time for a motion-status answer
  climate_timeout_s: 0.1
  climate_max_miss: 3       # give up on a climate field after this many silences

  sim_joint_speed: 0.5      # sim only, wire units per second
  sim_jaw_speed: 10.0

  limits:
    jaw:      {min: 1.30, max: 13.30, rest: 1.30, max_vel: 10.0}
    wrist:    {min: 0.00, max: 184.5, rest: 0.00, max_vel: 28.6479}
    elbow:    {min: 0.00, max: 184.5, rest: 0.00, max_vel: 28.6479}
    shoulder: {min: 0.00, max: 200.0, rest: 90.0, max_vel: 28.6479}
    base:     {min: 0.00, max: 349.6, rest: 0.00, max_vel: 28.6479}

ctrl:
  rate_hz: 5.0

  max_joint_step_deg: 1.0   # biggest joint move in one waypoint
  line_step_m: 0.005        # knot spacing on a straight-line move

  goal_tolerance_deg: 1.5

  feedback_timeout_s: 0.5
  arrival_timeout_s: 15.0   # then release to standby and report STALLED

  pillow_stop: true
  pillow_min_step_deg: 0.2
  pillow_follow_frac: 0.2
  pillow_strikes: 10

task:
  rate_hz: 5.0

  standoff_m: 0.04
  max_approach_dev_deg: 35.0

  depth_min_m: 0.040
  depth_max_m: 0.065
  depth_step_m: 0.005

  leg_samples: 8
  auto_sequence: false
  ctrl_silence_s: 1.0

  jaw_held_mm: 0.5
  jaw_still_mm: 0.1
  jaw_settle_s: 1.0
